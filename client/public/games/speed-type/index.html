<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SpeedTyper Benchmark | Devansh Kumar</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600&family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Poppins', sans-serif;
    }
    body {
      background: radial-gradient(circle at 50% 30%, #1e1e24 0%, #121214 70%, #0a0a0c 100%);
      color: #fafafa;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-bottom: 40px;
    }
    .top-bar {
      width: 100%;
      background: rgba(30, 30, 32, 0.85);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid #383838;
      padding: 14px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .brand-title {
      font-size: 15px;
      font-weight: 600;
      color: #ffdb70;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .back-btn {
      color: #fafafa;
      text-decoration: none;
      background: #2b2b2c;
      border: 1px solid #383838;
      padding: 7px 16px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 500;
      transition: all 0.25s ease;
    }
    .back-btn:hover {
      background: #ffdb70;
      color: #121214;
      border-color: #ffdb70;
    }
    .game-container {
      max-width: 680px;
      width: 92%;
      margin-top: 30px;
      text-align: center;
    }
    h1 {
      font-size: 28px;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 6px;
    }
    .subtitle {
      color: #a0a0a5;
      font-size: 14px;
      margin-bottom: 24px;
    }
    .stats-row {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-bottom: 24px;
    }
    .stat-card {
      background: #1e1e1f;
      border: 1px solid #383838;
      border-radius: 14px;
      padding: 14px 22px;
      min-width: 110px;
    }
    .stat-label {
      font-size: 12px;
      color: #a0a0a5;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .stat-val {
      font-size: 30px;
      font-weight: 700;
      color: #ffdb70;
      margin-top: 2px;
    }
    .text-display {
      background: #161619;
      border: 1px solid #383838;
      border-radius: 16px;
      padding: 24px;
      font-family: 'Fira Code', monospace;
      font-size: 16px;
      line-height: 1.8;
      text-align: left;
      user-select: none;
      margin-bottom: 20px;
      min-height: 120px;
    }
    .char-correct {
      color: #27c93f;
    }
    .char-incorrect {
      color: #ff5f56;
      background: rgba(255, 95, 86, 0.2);
      border-radius: 2px;
    }
    .char-current {
      border-bottom: 2px solid #ffdb70;
      animation: blink 0.9s infinite;
    }
    @keyframes blink {
      50% { border-color: transparent; }
    }
    .input-field {
      width: 100%;
      background: #1e1e1f;
      border: 2px solid #383838;
      border-radius: 14px;
      color: #ffffff;
      padding: 16px 20px;
      font-size: 16px;
      outline: none;
      transition: border-color 0.25s ease;
      margin-bottom: 20px;
    }
    .input-field:focus {
      border-color: #ffdb70;
      box-shadow: 0 0 16px rgba(255, 219, 112, 0.2);
    }
    .restart-btn {
      background: #ffdb70;
      color: #121214;
      border: none;
      padding: 10px 28px;
      border-radius: 999px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
    }
    .restart-btn:hover {
      background: #ff9f43;
      transform: translateY(-2px);
    }
  </style>
</head>
<body>
  <div class="top-bar">
    <div class="brand-title">
      <span>⌨️</span>
      <span>Devansh Kumar Portfolio • Mini Browser Project</span>
    </div>
    <a href="/portfolio" class="back-btn">← Back to Portfolio</a>
  </div>

  <div class="game-container">
    <h1>SpeedTyper Benchmark</h1>
    <p class="subtitle">Test your typing speed and accuracy live in the browser</p>

    <div class="stats-row">
      <div class="stat-card">
        <div class="stat-label">WPM</div>
        <div class="stat-val" id="wpm-val">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Accuracy</div>
        <div class="stat-val" id="acc-val">100%</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Time</div>
        <div class="stat-val" id="time-val">60s</div>
      </div>
    </div>

    <div class="text-display" id="quote-display"></div>

    <input type="text" class="input-field" id="quote-input" placeholder="Start typing the text above to trigger the timer..." autocomplete="off" autofocus />

    <button type="button" class="restart-btn" id="restart-btn">Restart Test</button>
  </div>

  <script>
    const quotes = [
      "Full-stack development requires balancing clean backend APIs with intuitive user interface design.",
      "React hooks empower developers to write modular, reusable state logic without nested component trees.",
      "The MERN stack seamlessly unites MongoDB databases, Express servers, React frontends, and Node runtimes.",
      "Writing performant algorithms requires understanding data structures and continuous profiling.",
      "Modern web applications succeed through fast initial loading, responsive layouts, and robust reliability."
    ];

    let currentQuote = "";
    let timer = 60;
    let timerInterval = null;
    let isTestActive = false;
    let errors = 0;

    const quoteDisplay = document.getElementById("quote-display");
    const quoteInput = document.getElementById("quote-input");
    const wpmVal = document.getElementById("wpm-val");
    const accVal = document.getElementById("acc-val");
    const timeVal = document.getElementById("time-val");
    const restartBtn = document.getElementById("restart-btn");

    function loadQuote() {
      currentQuote = quotes[Math.floor(Math.random() * quotes.length)];
      quoteDisplay.innerHTML = "";
      currentQuote.split("").forEach((char, index) => {
        const span = document.createElement("span");
        span.innerText = char;
        if (index === 0) span.classList.add("char-current");
        quoteDisplay.appendChild(span);
      });
      quoteInput.value = "";
    }

    function startTimer() {
      if (isTestActive) return;
      isTestActive = true;
      timer = 60;
      timeVal.innerText = `${timer}s`;

      timerInterval = setInterval(() => {
        timer--;
        timeVal.innerText = `${timer}s`;

        // Calculate WPM
        const wordsTyped = quoteInput.value.trim().split(/\s+/).filter(Boolean).length;
        const minutes = (60 - timer) / 60;
        const wpm = minutes > 0 ? Math.round(wordsTyped / minutes) : 0;
        wpmVal.innerText = wpm;

        if (timer <= 0) {
          clearInterval(timerInterval);
          quoteInput.disabled = true;
          isTestActive = false;
        }
      }, 1000);
    }

    quoteInput.addEventListener("input", () => {
      startTimer();

      const spans = quoteDisplay.querySelectorAll("span");
      const inputChars = quoteInput.value.split("");
      let currentErrors = 0;

      spans.forEach((span, index) => {
        const char = inputChars[index];
        span.className = "";

        if (char == null) {
          if (index === inputChars.length) span.classList.add("char-current");
        } else if (char === span.innerText) {
          span.classList.add("char-correct");
        } else {
          span.classList.add("char-incorrect");
          currentErrors++;
        }
      });

      // Accuracy
      const totalChars = inputChars.length;
      if (totalChars > 0) {
        const accuracy = Math.max(0, Math.round(((totalChars - currentErrors) / totalChars) * 100));
        accVal.innerText = `${accuracy}%`;
      }

      // Check if finished
      if (inputChars.length === currentQuote.length && currentErrors === 0) {
        clearInterval(timerInterval);
        const minutes = (60 - timer) / 60;
        const words = currentQuote.split(" ").length;
        wpmVal.innerText = Math.round(words / (minutes || 1/60));
        quoteInput.disabled = true;
      }
    });

    restartBtn.addEventListener("click", () => {
      clearInterval(timerInterval);
      isTestActive = false;
      timer = 60;
      timeVal.innerText = "60s";
      wpmVal.innerText = "0";
      accVal.innerText = "100%";
      quoteInput.disabled = false;
      loadQuote();
      quoteInput.focus();
    });

    loadQuote();
  </script>
</body>
</html>
